<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Task List</title>
  <style>
    :root{--bg:#f6f8fa;--card:#ffffff;--accent:#0366d6;--danger:#d32f2f;--muted:#6b7280}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#111}
    .wrap{max-width:640px;margin:48px auto;padding:24px}
    .card{background:var(--card);border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,0.06);padding:20px}
    header{display:flex;flex-direction:column;gap:12px}
    h1{margin:0;font-size:20px}
    .controls{display:flex;gap:8px}
    .controls input[type="text"]{flex:1;padding:10px 12px;border:1px solid #e6eef8;border-radius:8px;font-size:15px}
    .controls button{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
    .controls button:active{transform:translateY(1px)}
    .task-list{margin-top:18px;display:flex;flex-direction:column;gap:8px}
    .task{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;border:1px solid transparent}
    .task[aria-checked="true"]{background:linear-gradient(90deg,rgba(3,102,214,0.04),transparent)}
    .task input[type="checkbox"]{width:18px;height:18px}
    .task .label{flex:1;font-size:15px}
    .task .label.completed{color:var(--muted);text-decoration:line-through}
    .task button.delete{background:transparent;border:1px solid #f3d0d0;color:var(--danger);padding:6px 8px;border-radius:8px;cursor:pointer}
    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:14px}
    .small{font-size:13px;color:var(--muted)}
    @media (max-width:420px){.wrap{margin:18px;padding:12px}.controls input[type="text"]{font-size:14px}.controls button{padding:10px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="application" aria-labelledby="appTitle">
      <header>
        <h1 id="appTitle">Task List</h1>
        <p class="small">Add tasks, mark them complete, or delete them. Tasks are saved in your browser.</p>
        <div class="controls" aria-hidden="false">
          <label for="newTask" class="sr-only" style="position:absolute;left:-9999px;">New task</label>
          <input id="newTask" type="text" placeholder="Add a new task and press Enter" aria-label="New task" />
          <button id="addBtn" aria-label="Add task">Add</button>
        </div>
      </header>
      <main>
        <div id="taskList" class="task-list" aria-live="polite"></div>
      </main>
      <div class="footer">
        <div id="count" class="small">0 tasks</div>
        <div style="display:flex;gap:8px">
          <button id="clearCompleted" class="small" style="background:transparent;border:none;color:var(--accent);cursor:pointer">Clear completed</button>
          <button id="clearAll" class="small" style="background:transparent;border:none;color:var(--danger);cursor:pointer">Clear all</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Single-file Task List App (no external libs)
    // Storage key
    const STORAGE_KEY = 'taskListApp.tasks.v1';

    // DOM refs
    const newTaskInput = document.getElementById('newTask');
    const addBtn = document.getElementById('addBtn');
    const taskListEl = document.getElementById('taskList');
    const countEl = document.getElementById('count');
    const clearCompletedBtn = document.getElementById('clearCompleted');
    const clearAllBtn = document.getElementById('clearAll');

    // In-memory tasks array
    let tasks = [];

    // Helpers
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    }

    function saveTasks(){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }catch(e){
        console.error('Failed to save tasks to localStorage', e);
      }
    }

    function loadTasks(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        tasks = raw ? JSON.parse(raw) : [];
      }catch(e){
        console.error('Failed to load tasks from localStorage', e);
        tasks = [];
      }
    }

    function renderTasks(){
      taskListEl.innerHTML = '';
      if(tasks.length === 0){
        const empty = document.createElement('div');
        empty.className = 'small';
        empty.textContent = 'No tasks yet — add one above.';
        taskListEl.appendChild(empty);
      }else{
        tasks.forEach(task => {
          const row = document.createElement('div');
          row.className = 'task';
          row.setAttribute('role','listitem');
          row.setAttribute('data-id', task.id);
          row.setAttribute('aria-checked', task.completed ? 'true' : 'false');

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = !!task.completed;
          cb.setAttribute('aria-label', task.completed ? 'Mark task as incomplete' : 'Mark task as complete');
          cb.addEventListener('change', () => toggleComplete(task.id));

          const label = document.createElement('div');
          label.className = 'label' + (task.completed ? ' completed' : '');
          label.textContent = task.text;
          label.title = task.text;

          const del = document.createElement('button');
          del.className = 'delete';
          del.textContent = 'Delete';
          del.setAttribute('aria-label','Delete task');
          del.addEventListener('click', () => deleteTask(task.id));
          row.appendChild(cb);
          row.appendChild(label);
          row.appendChild(del);
          taskListEl.appendChild(row);
        });
      }
      updateCount();
    }

    function updateCount(){
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      countEl.textContent = `${total} ${total === 1 ? 'task' : 'tasks'} (${completed} completed)`;
    }

    function addTask(text){
      const trimmed = text.trim();
      if(!trimmed) return;
      tasks.unshift({id:uid(), text:trimmed, completed:false, createdAt:Date.now()});
      saveTasks();
      renderTasks();
    }

    function toggleComplete(id){
      const i = tasks.findIndex(t => t.id === id);
      if(i === -1) return;
      tasks[i].completed = !tasks[i].completed;
      saveTasks();
      renderTasks();
    }

    function deleteTask(id){
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    function clearCompleted(){
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      renderTasks();
    }

    function clearAll(){
      if(!confirm('Clear all tasks? This cannot be undone.')) return;
      tasks = [];
      saveTasks();
      renderTasks();
    }

    // Event listeners
    addBtn.addEventListener('click', () => {
      addTask(newTaskInput.value);
      newTaskInput.value = '';
      newTaskInput.focus();
    });

    newTaskInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        addTask(newTaskInput.value);
        newTaskInput.value = '';
      }
    });

    clearCompletedBtn.addEventListener('click', clearCompleted);
    clearAllBtn.addEventListener('click', clearAll);

    // Keyboard accessibility: allow Delete key to delete a focused task label
    taskListEl.addEventListener('keydown', (e) => {
      const el = e.target.closest('.task');
      if(!el) return;
      const id = el.getAttribute('data-id');
      if(e.key === 'Delete') deleteTask(id);
    });

    // Initialize app
    (function init(){
      loadTasks();
      renderTasks();
    })();
  </script>
</body>
</html>
